# Compose services consumed by `uv run coworld build --project .`:
# service names map to manifest image placeholders ({{GAME_IMAGE}},
# {{PLAYER_IMAGE}}). Game and players ship in one image (single
# Dockerfile); the manifest `run` command selects the role entrypoint.
services:
  game:
    image: cogame-moba-game:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host
  player:
    image: cogame-moba-player:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host
