# Paces the hosted Moba league at ~10 episodes every ~10 minutes.
#
# The platform ladder is configured with scheduler.num_episodes=10 and
# auto-scheduling paused (the league free-runs otherwise); each run of
# this workflow unpauses rounds, triggers exactly one round, waits for
# it to complete (~1-2 min for 10 episodes), and re-pauses. GitHub's
# cron has multi-minute jitter — acceptable, the cadence is approximate
# by design.
name: league-rounds

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One pacing run at a time; a queued run waiting is fine, overlapping
# unpause/re-pause sequences are not.
concurrency:
  group: league-rounds
  cancel-in-progress: false

env:
  # Moba league id — provenance: the Phase 6 deployment log
  # (tmp/phase6_log.md) records this league's creation.
  LEAGUE_ID: league_becba59f-4201-43a5-9cd6-970bd92857d9
  BASE: https://softmax.com/api/observatory/v2

jobs:
  trigger-round:
    runs-on: ubuntu-latest
    env:
      HAVE_SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN != '' }}
    steps:
      # Same guard shape as ci.yml's upload-coworld job: without the
      # credential this is a no-op warning, never a red run.
      - name: Check credential
        run: |
          if [ "$HAVE_SOFTMAX_TOKEN" != "true" ]; then
            echo "::warning::SOFTMAX_TOKEN secret is not set; skipping the league round."
          fi
      - name: Unpause and trigger one round
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        env:
          # Token reaches curl via env, never a rendered argv.
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          post() {
            local path="$1" body="${2:-}"
            local code
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $SOFTMAX_TOKEN" \
              -H "X-Use-Elevated-Privileges: true" \
              -H "Content-Type: application/json" \
              ${body:+-d "$body"} \
              "$BASE$path")
            echo "POST $path -> $code"
            cat /tmp/resp.txt; echo
            case "$code" in
              2*) ;;
              *) echo "::error::POST $path failed with HTTP $code"; exit 1 ;;
            esac
          }
          post "/leagues/$LEAGUE_ID/rounds-paused" '{"paused": false}'
          post "/leagues/$LEAGUE_ID/trigger-round"
      - name: Let the round complete
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        run: sleep 120  # a 10-episode round completes in ~1-2 minutes
      # always(): a transient trigger failure must not leave the league
      # unpaused and free-running.
      - name: Re-pause rounds
        if: always() && env.HAVE_SOFTMAX_TOKEN == 'true'
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SOFTMAX_TOKEN" \
            -H "X-Use-Elevated-Privileges: true" \
            -H "Content-Type: application/json" \
            -d '{"paused": true}' \
            "$BASE/leagues/$LEAGUE_ID/rounds-paused")
          echo "POST /leagues/$LEAGUE_ID/rounds-paused -> $code"
          cat /tmp/resp.txt; echo
          case "$code" in
            2*) ;;
            *) echo "::error::re-pause failed with HTTP $code"; exit 1 ;;
          esac
