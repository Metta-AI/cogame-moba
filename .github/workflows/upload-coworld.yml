name: Upload Coworld

# Builds the game/player image via compose.yaml and uploads a new "moba"
# version to Softmax (https://softmax.com/api) on every push to main.
# The version is the HIGHEST EXISTING moba registry row with the patch
# bumped (tools/ci/next_coworld_version.py), unless an explicit version
# is passed via workflow_dispatch. Do NOT use `coworld next-version`
# here: it is canonical-based, so an orphan non-canonical row from a
# half-failed publish wedges every later publish with 409s (see the
# picker's docstring; seven consecutive coworld-ctf publishes wedged
# overnight 2026-07-30/31 this way).
#
# Bootstrap (Phase 6): the picker hard-fails while the registry has no
# "moba" rows, so the FIRST upload must either be a one-time local
# `coworld upload-coworld` or a workflow_dispatch run with an explicit
# version input.
#
# Auth: the SOFTMAX_TOKEN repo secret — a non-expiring "cogame-moba-ci"
# user credential (softmax.com/observatory/credentials). The secret does
# not exist until Phase 6 mints it; until then every run takes the
# guarded skip path below and succeeds without uploading, so merging
# this workflow is safe. To (re)set it:
#   gh secret set SOFTMAX_TOKEN --repo Metta-AI/cogame-moba

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version (default: bump patch of latest uploaded moba)"
        required: false

# One upload at a time; queued runs wait so version query/bump cannot race.
concurrency:
  group: upload-coworld
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      HAVE_SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN != '' }}
    steps:
      - name: Check upload credential
        run: |
          if [ "$HAVE_SOFTMAX_TOKEN" != "true" ]; then
            echo "::warning::SOFTMAX_TOKEN secret is not set; skipping the Coworld upload." \
                 " Phase 6 mints the cogame-moba-ci credential" \
                 " (softmax.com/observatory/credentials) and sets the repo secret."
          fi
      - uses: actions/checkout@v5
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        with:
          path: cogame-moba
      - uses: astral-sh/setup-uv@v6
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
      - name: Authenticate to Softmax
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        run: uvx --from "coworld[auth]==0.1.34" softmax set-token "${{ secrets.SOFTMAX_TOKEN }}"
      - name: Determine version
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        id: version
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          python3 cogame-moba/tools/ci/test_next_coworld_version.py
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version=$(python3 cogame-moba/tools/ci/next_coworld_version.py moba)
          fi
          echo "Uploading as moba $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Two-step flow: `build` (compose build + manifest hydration from
      # the template) then `upload-coworld` (registry push + hosted
      # smoke certification).
      - name: Build, certify, and upload
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        working-directory: cogame-moba
        run: |
          uvx --from "coworld[auth]==0.1.34" coworld build \
            --version "${{ steps.version.outputs.version }}" \
            --project . \
            --compose compose.yaml \
            --template coworld_manifest_template.json \
            --output dist/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.34" coworld upload-coworld \
            dist/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800
      - name: Verify upload
        if: env.HAVE_SOFTMAX_TOKEN == 'true'
        run: |
          set -euo pipefail
          uvx --from "coworld[auth]==0.1.34" coworld list --json --limit 500 > /tmp/coworlds-after.json
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import json, sys
          expected = sys.argv[1]
          rows = json.load(open("/tmp/coworlds-after.json"))
          for name in ("moba",):
              match = [r for r in rows if r.get("name") == name and r.get("version") == expected]
              if not match:
                  raise SystemExit(f"uploaded {name} version {expected} not found on server")
              entry = match[0]
              if not entry.get("canonical"):
                  raise SystemExit(
                      f"{name}:{expected} uploaded but is not canonical; "
                      "the league will not advance. Hosted smoke certification likely did not pass."
                  )
              print(entry["id"], entry["name"], entry["version"], "canonical")
          EOF
